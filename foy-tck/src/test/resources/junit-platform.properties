# Safety net for full-suite TCK measurement runs: a few TCK clients read from
# raw sockets without SO_TIMEOUT (e.g. HttpServletRequest40Tests.TrailerTest)
# and hang forever when the implementation never answers. A generous global
# timeout turns those hangs into reported errors instead of blocking the run.
# SEPARATE_THREAD is required: a thread stuck in Socket.read() does not react
# to interruption, so the watchdog must abandon it.
junit.jupiter.execution.timeout.default = 120 s
junit.jupiter.execution.timeout.thread.mode.default = SEPARATE_THREAD
